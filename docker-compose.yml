version: '3.9'

services:
  db:
    image: postgres:16
    container_name: demo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
